<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wireless Oximeter</title>
	<style>
		:root { color-scheme: light; font-family: system-ui, sans-serif; --muted: #537078; --line: #d6e1e3; --ok: #1d7a46; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #a12b2b; --bad-bg: #fbe4e4; --red: #d0453a; --ir: #6d4bc2; }
		body { margin: 0; background: #f4f7f8; color: #18323a; }
		main { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
		header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; }
		h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
		#updated { color: var(--muted); font-size: 0.9rem; }
		#updated.bad { color: var(--bad); font-weight: 600; }
		#devices { display: grid; gap: 1rem; margin-top: 2rem; }
		article { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; box-shadow: 0 4px 16px rgb(24 50 58 / 8%); }
		article.offline { opacity: 0.75; }
		.title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
		h2 { margin: 0; font-size: 1.2rem; }
		.badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
		.badge { border-radius: 999px; padding: 0.2rem 0.65rem; font-size: 0.8rem; font-weight: 600; }
		.badge::before { content: "●"; margin-right: 0.35rem; }
		.ok { color: var(--ok); background: var(--ok-bg); }
		.warn { color: var(--warn); background: var(--warn-bg); }
		.bad { color: var(--bad); background: var(--bad-bg); }
		.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
		.vital { border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; }
		.vital span { display: block; color: var(--muted); font-size: 0.85rem; }
		.vital strong { font-size: 1.8rem; font-variant-numeric: tabular-nums; }
		.vital small { color: var(--muted); }
		.chart { margin-top: 0.75rem; }
		.chart p { margin: 0 0 0.25rem; color: var(--muted); font-size: 0.85rem; }
		canvas { display: block; width: 100%; height: 90px; background: #fafcfc; border: 1px solid var(--line); border-radius: 6px; }
		.note { color: var(--muted); margin: 0.5rem 0 0; }
		.empty { color: var(--muted); }
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Wireless Oximeter</h1>
			<span id="updated">Connecting to backend…</span>
		</header>
		<section id="devices" aria-live="polite"><p class="empty">Loading…</p></section>
	</main>
	<script>
		const devices = document.querySelector("#devices");
		const updated = document.querySelector("#updated");

		function value(value, fallback = "--") {
			return value === null || value === undefined ? fallback : value;
		}

		function ago(seconds) {
			if (seconds === null || seconds === undefined) return "never";
			if (seconds < 60) return `${Math.round(seconds)} s ago`;
			if (seconds < 3600) return `${Math.round(seconds / 60)} min ago`;
			return `${Math.round(seconds / 3600)} h ago`;
		}

		function escapeHtml(text) {
			return String(text).replace(/[&<>"']/g, (char) => `&#${char.charCodeAt(0)};`);
		}

		function badges(device) {
			if (device.connection === "never") {
				return '<span class="badge bad">ESP32 never connected</span>';
			}
			if (device.connection === "offline") {
				return `<span class="badge bad">ESP32 offline</span><span class="badge warn">No data · last ${ago(device.seconds_since_seen)}</span>`;
			}
			const sensor = device.finger_detected
				? '<span class="badge ok">Finger detected</span>'
				: '<span class="badge warn">No finger on sensor</span>';
			return `<span class="badge ok">ESP32 online</span><span class="badge ok">Receiving data</span>${sensor}`;
		}

		function note(device) {
			if (device.connection === "never") {
				return '<p class="note">No packet has arrived from this device yet. Check that the ESP32 is powered, on Wi-Fi, and that MQTT_BROKER points at this Pi, and that run_mqtt.py is running.</p>';
			}
			if (device.connection === "offline") {
				return '<p class="note">Packets have stopped. The ESP32 may be off or out of Wi-Fi range, or run_mqtt.py is not running. Showing the last packet received.</p>';
			}
			if (!device.finger_detected) {
				return '<p class="note">Data is arriving, but the signal is too weak for a reading. Place a finger on the sensor.</p>';
			}
			return "";
		}

		function drawWave(canvas, samples, color) {
			const ratio = window.devicePixelRatio || 1;
			const width = canvas.clientWidth;
			const height = canvas.clientHeight;
			canvas.width = width * ratio;
			canvas.height = height * ratio;
			const context = canvas.getContext("2d");
			context.scale(ratio, ratio);
			context.clearRect(0, 0, width, height);
			if (samples.length < 2) return;

			const min = Math.min(...samples);
			const max = Math.max(...samples);
			const range = max - min || 1;
			const pad = 8;

			context.strokeStyle = color;
			context.lineWidth = 2;
			context.lineJoin = "round";
			context.beginPath();
			samples.forEach((sample, index) => {
				const x = (index / (samples.length - 1)) * width;
				const y = height - pad - ((sample - min) / range) * (height - pad * 2);
				index ? context.lineTo(x, y) : context.moveTo(x, y);
			});
			context.stroke();
		}

		function card(device) {
			const online = device.connection === "online";
			const live = online && device.finger_detected;
			const id = escapeHtml(device.device_id);
			const charts = device.red.length ? `
				<div class="chart"><p>Infrared (IR) · ${device.ir.length} samples at ${value(device.sample_rate)} Hz</p><canvas data-wave="ir"></canvas></div>
				<div class="chart"><p>Red · ${device.red.length} samples</p><canvas data-wave="red"></canvas></div>` : "";

			return `
				<article class="${online ? "" : "offline"}">
					<div class="title"><h2>${id}</h2><div class="badges">${badges(device)}</div></div>
					<div class="vitals">
						<div class="vital"><span>Heart rate</span><strong>${live ? value(device.heart_rate) : "--"}</strong> <small>bpm</small></div>
						<div class="vital"><span>SpO2</span><strong>${live ? value(device.spo2) : "--"}</strong> <small>%</small></div>
						<div class="vital"><span>Last packet</span><strong style="font-size:1.1rem">${ago(device.seconds_since_seen)}</strong></div>
					</div>
					${note(device)}
					${charts}
				</article>`;
		}

		async function refresh() {
			try {
				const response = await fetch("/api/devices");
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				const entries = Object.values(await response.json());

				devices.innerHTML = entries.length
					? entries.map(card).join("")
					: '<p class="empty">No devices registered. Run <code>python seed_dev_data.py OXI001</code> on the Pi.</p>';

				const cards = devices.querySelectorAll("article");
				entries.forEach((device, index) => {
					for (const canvas of cards[index].querySelectorAll("canvas")) {
						const isIr = canvas.dataset.wave === "ir";
						drawWave(canvas, isIr ? device.ir : device.red, isIr ? "#6d4bc2" : "#d0453a");
					}
				});

				updated.className = "";
				updated.textContent = `Backend connected · updated ${new Date().toLocaleTimeString()}`;
			} catch (error) {
				updated.className = "bad";
				updated.textContent = "Backend unreachable: is run.py still running?";
				console.error(error);
			}
		}

		refresh();
		setInterval(refresh, 2000);
	</script>
</body>
</html>
