services:
  postgres:
    image: postgres:16
    container_name: wireless-oximeter-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wireless_oximeter
      POSTGRES_USER: oximeter
      POSTGRES_PASSWORD: oximeter_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wireless-oximeter-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  postgres_data: